name: Chapter 13 Submission Verification

on:
  push:
    paths:
      - ".github/workflows/ch13_once.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chapter 13 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib requests beautifulsoup4 python-dotenv nbconvert ipykernel
      - name: Network-free Chapter 13 setup
        run: python scripts/run_external_data_collection.py
      - name: Execute submission notebook offline
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute assignments/chapter13/chapter13.ipynb --inplace --ExecutePreprocessor.timeout=300
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          nb_path = Path("assignments/chapter13/chapter13.ipynb")
          nb = json.loads(nb_path.read_text(encoding="utf-8"))
          code = [c for c in nb["cells"] if c["cell_type"]=="code"]
          assert all(c["execution_count"] is not None for c in code)
          assert not [o for c in code for o in c.get("outputs",[]) if o.get("output_type")=="error"]
          assert len(list(Path("assignments/chapter13/images").glob("*.png"))) == 4
          gate = pd.read_csv("reports/ch13_network_execution_gate.csv")
          assert (gate["default"].astype(str).str.lower()=="false").all()
          decision = pd.read_csv("reports/ch13_student_execution_decision.csv")
          assert decision.loc[decision.scope=="actual_external_collection", "execution_status"].iloc[0]=="SKIPPED"
          assert (decision.requests==0).all()
          assert len(list(Path("reports").glob("ch13_*"))) >= 16
          print("CH13 PASS:",len(code),"code cells, 4 images, 16+ report artifacts, 0 API requests")
          PY
      - name: Commit executed notebook and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assignments/chapter13/chapter13.ipynb assignments/chapter13/images reports/ch13_*
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Execute Chapter 13 safe external-data assignment"
            git push
          fi
