name: Execute Chapter 11 Assignment

on:
  push:
    paths:
      - ".github/workflows/ch11_execute.yml"

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib nbconvert ipykernel

      - name: Prepare Chapter 11 processed input
        run: |
          python scripts/preprocess_data.py

      - name: Run Chapter 11 artifact generator
        run: |
          python scripts/run_llm_prompt_analysis.py

      - name: Execute Chapter 11 notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute assignments/chapter11/chapter11.ipynb --inplace --ExecutePreprocessor.timeout=600

      - name: Commit executed notebook and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assignments/chapter11/chapter11.ipynb assignments/chapter11/images reports/ch11_* data/processed/*_clean.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Execute Chapter 11 safe LLM prompt assignment"
            git push
          fi

