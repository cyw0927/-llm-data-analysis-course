name: Execute Chapter 10 Notebook

on:
  push:
    paths:
      - ".github/workflows/ch10_execute.yml"

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare validated Chapter 10 input
        run: |
          python scripts/prepare_ch10_data.py

      - name: Execute Chapter 10 notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute assignments/chapter10/chapter10.ipynb --inplace --ExecutePreprocessor.timeout=600

      - name: Verify full classification pipeline
        run: |
          python scripts/run_classification_analysis.py

      - name: Commit executed notebook and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assignments/chapter10/chapter10.ipynb assignments/chapter10/images reports/ch10_* data/processed/*_clean.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Execute Chapter 10 classification assignment"
            git push
          fi

